    const reverseBits = t => { let e=t; e=(e<<16)|(e>>>16); e=((e&1431655765)<<1)|((e&2863311530)>>>1); e=((e&858993459)<<2)|((e&3435973836)>>>2); e=((e&252645135)<<4)|((e&4042322160)>>>4); e=((e&16711935)<<8)|((e&4278255360)>>>8); return (e>>>0)*23283064365386963e-26; };
    const seeds = Array.from({length:260}, (_,e) => { const o=rand(e,1), i=rand(e,2), w=rand(e,3), p=rand(e,4), f=(e*.61803398875+o*.08)%1-.5, h=reverseBits(e+1)-.5+(i-.5)*.08, c=o*Math.PI*2; return { viewportX:f, viewportY:Math.max(-.5,Math.min(.5,h)), headingX:Math.cos(c), headingY:Math.sin(c), perpendicularX:-Math.sin(c), perpendicularY:Math.cos(c), phase:o*Math.PI*2, progress:i, driftScale:.72+i*.55, jitterX:w*2-1, jitterY:p*2-1, scale:.82+o*.34, turn:e%2===0?1:-1, speed:.7+i*.65 }; });
    const targetFor = (seed, now, vw, vh) => {
      const spread=params.spread;
      const centerX=vw* (mobile?settings.formation.mobileX:settings.formation.desktopX);
      const centerY=vh* (mobile?settings.formation.mobileY:settings.formation.desktopY);
      const spreadX=(mobile?settings.formation.mobileSpreadX:settings.formation.desktopSpreadX)*spread;
      const spreadY=(mobile?settings.formation.mobileSpreadY:settings.formation.desktopSpreadY)*spread;
      const route=Math.hypot(vw,vh)*params.routeLength;
      const progress=(seed.progress + now*params.speed*seed.speed/1000/route)%1-.5;
      const wobble=Math.sin(now*settings.drift.speed*seed.speed/1000+seed.phase)*params.wobble*params.drift*seed.driftScale;
      const driftX=Math.cos(now*settings.drift.speed*seed.speed/1000+seed.phase)*settings.drift.radiusX*params.drift*seed.driftScale;
      const driftY=Math.sin(now*settings.drift.speed*seed.speed/1000+seed.phase*1.31)*settings.drift.radiusY*params.drift*seed.driftScale;
      return { x:centerX+seed.viewportX*vw*spreadX+seed.jitterX*settings.formation.jitterPx*params.drift+seed.headingX*route*progress+seed.perpendicularX*wobble+driftX, y:centerY+seed.viewportY*vh*spreadY+seed.jitterY*settings.formation.jitterPx*params.drift+seed.headingY*route*progress+seed.perpendicularY*wobble+driftY };
    };
    function resize(){ const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight),aspect=w/h,viewH=10; renderer.setSize(w,h,false); camera.top=viewH/2; camera.bottom=-viewH/2; camera.left=-viewH*aspect/2; camera.right=viewH*aspect/2; camera.updateProjectionMatrix(); }
    addEventListener('resize',resize,{passive:true}); resize();
    function toWorld(px,py){ return new THREE.Vector3((px/innerWidth-.5)*(camera.right-camera.left), -((py/innerHeight-.5)*(camera.top-camera.bottom)), 0); }
    function makeShadow(){ return new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,uniforms:{uOpacity:{value:settings.shadow.opacity},uBlur:{value:settings.shadow.blur}},vertexShader:'varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'uniform float uOpacity; uniform float uBlur; varying vec2 vUv; void main(){vec2 uv=(vUv-vec2(.5))*2.;vec2 shaped=uv*vec2(1.,1.45);float softness=max(uBlur,.001);float alpha=exp(-dot(shaped,shaped)/softness);alpha=pow(alpha,1.55)*smoothstep(1.15,.12,length(uv));gl_FragColor=vec4(0.,0.,0.,alpha*uOpacity);}' })); }
    function addFlight(template, seed, index){ const root=new THREE.Group(); const plane=template.clone(true); plane.traverse(n=>{if(n.isMesh){n.material=new THREE.MeshPhongMaterial({color:0xf0eeeb,specular:0x8f8f8f,shininess:20,flatShading:false,side:THREE.DoubleSide});}}); const box=new THREE.Box3().setFromObject(plane); plane.position.sub(box.getCenter(new THREE.Vector3())); const sh=makeShadow(); root.add(plane); planeField.add(root); planeField.add(sh); const start=toWorld(seed.viewportX*innerWidth+innerWidth/2,seed.viewportY*innerHeight+innerHeight/2); const item={root,plane,shadow:sh,shadowRoot:sh,seed,current:start.clone(),previous:start.clone(),target:start.clone(),velocity:new THREE.Vector3(),tangent:new THREE.Vector3(index%2===0?1:-1,.1,0).normalize(),previousTangent:new THREE.Vector3(1,0,0),rotation:new THREE.Quaternion(),bank:0,scale:(mobile?settings.plane.mobileScale:settings.plane.desktopScale)*seed.scale}; root.position.copy(start); items.push(item); }
    let hovered=null;
    function updateHover(e){ const r=canvas.getBoundingClientRect(),x=((e.clientX-r.left)/r.width)*2-1,y=-(((e.clientY-r.top)/r.height)*2-1); hovered=null; let best=.06; for(const item of items){const p=item.root.position.clone().project(camera);const d=Math.hypot(p.x-x,p.y-y);if(d<best){best=d;hovered=item;}} }
    canvas.addEventListener('pointermove',e=>{pointer.has=true;pointer.x=e.clientX;pointer.y=e.clientY;pointer.lastAt=performance.now();updateHover(e);},{passive:true});
    canvas.addEventListener('pointerleave',()=>{hovered=null;pointer.has=false;},{passive:true});
    let template=null,last=performance.now();
    new GLTFLoader().load(MODEL_URL,gltf=>{ template=gltf.scene; for(let i=0;i<params.planes;i++) addFlight(template,seeds[i],i); requestAnimationFrame(frame); },undefined,err=>console.error('Plane model failed',err));
    function frame(now){ const dt=Math.min(.04,(now-last)/1000); last=now; const vw=innerWidth,vh=innerHeight; for(const item of items){ const seed=item.seed; const px=targetFor(seed, reduced?0:now,vw,vh); const target=toWorld(px.x,px.y); if(!reduced&&pointer.has&&now-pointer.lastAt<1200){const pp=toWorld(pointer.x,pointer.y),dx=item.root.position.x-pp.x,dy=item.root.position.y-pp.y,d=Math.max(Math.hypot(dx,dy),.001),radius=(params.mouseRadius/Math.max(vw,vh))*(camera.right-camera.left); if(d<radius){const fall=(1-d/radius)**2, push=(params.mousePush/Math.max(vw,vh))*(camera.right-camera.left)*fall*seed.driftScale, swirl=(params.mouseSwirl/Math.max(vw,vh))*(camera.right-camera.left)*fall*seed.turn; target.x+=dx/d*push-dy/d*swirl; target.y+=dy/d*push+dx/d*swirl;}} item.previous.copy(item.current); item.target.copy(target); item.current.lerp(item.target,reduced?1:1-Math.exp(-9.2*dt)); item.velocity.copy(item.current).sub(item.previous); if(item.velocity.lengthSq()>1e-8){targetTangent.copy(item.velocity).normalize();item.previousTangent.copy(item.tangent);item.tangent.lerp(targetTangent,reduced?1:1-Math.exp(-9*dt)).normalize();} const cross=item.previousTangent.x*item.tangent.y-item.previousTangent.y*item.tangent.x; const bank=Math.max(-settings.plane.maxBank,Math.min(settings.plane.maxBank,-cross*params.bank)); item.bank+=(bank-item.bank)*(reduced?1:1-Math.exp(-7*dt)); bankedUp.copy(up).applyAxisAngle(item.tangent,item.bank).normalize(); lookTarget.copy(item.current).add(item.tangent); matrix.lookAt(item.current,lookTarget,bankedUp); quaternion.setFromRotationMatrix(matrix); item.rotation.slerp(quaternion,reduced?1:1-Math.exp(-9*dt)); item.root.position.copy(item.current); item.root.quaternion.copy(item.rotation); item.root.scale.setScalar(item.scale*(item===hovered?1.28:1)); item.shadowRoot.position.set(item.current.x+settings.shadow.offsetX,item.current.y+settings.shadow.offsetY,-.08); item.shadowRoot.rotation.z=Math.atan2(item.tangent.y,item.tangent.x); item.shadowRoot.scale.set(item.scale*settings.shadow.width,item.scale*settings.shadow.height,1); item.shadowRoot.material.uniforms.uOpacity.value=item===hovered?.13:settings.shadow.opacity; } renderer.render(scene,camera); requestAnimationFrame(frame); }
  </script>
